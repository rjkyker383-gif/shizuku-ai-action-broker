name: Broker Contract Verify

on:
  push:
    paths:
      - 'app/src/main/java/com/rjkyker/shizukuai/broker/ActionAllowList.kt'
      - 'schemas/action.schema.json'
      - 'examples/action.example.json'
      - 'tests/verify_contract.py'
      - '.github/workflows/contract-verify.yml'
  pull_request:
    paths:
      - 'app/src/main/java/com/rjkyker/shizukuai/broker/ActionAllowList.kt'
      - 'schemas/action.schema.json'
      - 'examples/action.example.json'
      - 'tests/verify_contract.py'
      - '.github/workflows/contract-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify broker contract stays synchronized
        run: python3 tests/verify_contract.py
